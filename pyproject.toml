[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "inkreference"
version = "0.1.0"
description = "A local-first reference material library for writers"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.54,<1",
  "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
extraction = ["langgraph>=1,<2", "langgraph-checkpoint-sqlite>=3,<4", "langextract>=1,<2"]

[project.scripts]
inkreference = "inkreference.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/inkreference"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
addopts = "-ra"
