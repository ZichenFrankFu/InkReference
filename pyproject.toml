[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "inkreference"
version = "0.2.0"
description = "A local-first reference material library for writers"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.54,<1",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1",
  "langgraph>=1.2.16,<2",
  "langgraph-checkpoint-sqlite>=3.1.2,<4",
  "markdownify>=1.2,<2",
  "markdown-it-py>=4,<5",
  "keyring>=25.7,<26",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
desktop = ["pywebview>=6.2.1,<7"]
build = ["pyinstaller>=6,<7"]

[project.scripts]
inkreference = "inkreference.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["backend/inkreference"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
addopts = "-ra"
