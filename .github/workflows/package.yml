name: Build Windows and macOS desktop packages

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'scripts/**'
      - 'packaging/**'
      - 'pyproject.toml'
      - 'requirements-lock.txt'
      - '.github/workflows/package.yml'
  workflow_dispatch:
    inputs:
      installer:
        description: Also compile Windows Setup and macOS DMG
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Build the application without Conda
        shell: powershell
        run: |
          $buildInstaller = '${{ github.event_name }}' -eq 'pull_request' -or '${{ inputs.installer }}' -eq 'true'
          .\scripts\package.ps1 -CurrentEnvironment -Installer:$buildInstaller
      - name: Check the frozen UI, database and Windows credential store
        run: python scripts/verify_launch.py --require-vault -- release/app/InkReference/InkReference.exe --no-open --port 18765
      - uses: actions/upload-artifact@v7
        with:
          name: InkReference-windows-x64
          path: |
            release/InkReference-windows-x64.zip
            release/installer/*.exe
            release/package-manifest.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  macos:
    name: macOS ${{ matrix.arch }} application
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Build the native app, ZIP and optional disk image
        run: |
          if [ '${{ github.event_name }}' = 'pull_request' ] || [ '${{ inputs.installer }}' = 'true' ]; then
            ./scripts/package.sh --current-environment --dmg
          else
            ./scripts/package.sh --current-environment
          fi
      - name: Extract the distribution and check its signature and HTTP UI
        run: |
          destination="$RUNNER_TEMP/InkReference extracted app"
          /usr/bin/ditto -x -k "release/InkReference-macos-${{ matrix.arch }}.zip" "$destination"
          bundle="$destination/InkReference.app"
          /usr/bin/codesign --verify --deep --strict "$bundle"
          python scripts/verify_launch.py -- "$bundle/Contents/MacOS/InkReference" --no-open --port 18765
      - uses: actions/upload-artifact@v7
        with:
          name: InkReference-macos-${{ matrix.arch }}
          path: |
            release/InkReference-macos-${{ matrix.arch }}.zip
            release/InkReference-macos-${{ matrix.arch }}.dmg
            release/package-manifest.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
