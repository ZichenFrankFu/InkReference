name: InkReference checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: windows-latest
            python: '3.12'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install backend and test dependencies
        run: python -m pip install -c requirements-lock.txt -e ".[dev]"
      - name: Test data integrity, API and text preservation
        run: python -m pytest -q
      - name: Parse Windows PowerShell scripts
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          foreach ($file in Get-ChildItem scripts/*.ps1) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) {
              $parseErrors | Format-List
              throw "Invalid PowerShell syntax: $($file.Name)"
            }
          }
      - uses: actions/setup-node@v7
        if: runner.os == 'Windows'
        with:
          node-version: '22'
      - name: Run the Windows installation script
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\setup.ps1 -BrowserOnly
      - name: Start the Windows app and check HTTP health
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:INKREFERENCE_DATA_DIR = Join-Path $env:RUNNER_TEMP ('InkReference ' + [char]0x4e2d + [char]0x6587 + ' smoke')
          $stdout = Join-Path $env:RUNNER_TEMP 'inkreference-stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'inkreference-stderr.log'
          $arguments = @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', 'scripts/start.ps1', '-NoOpen', '-Port', '18765')
          $server = Start-Process -FilePath 'powershell.exe' -ArgumentList $arguments -WorkingDirectory $PWD.Path -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 50; $i++) {
              if ($server.HasExited) { throw 'The Windows launcher exited before becoming ready.' }
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:18765/api/health' -TimeoutSec 1
                if ($health.status -eq 'ok') { $ready = $true; break }
              } catch { Start-Sleep -Milliseconds 200 }
            }
            if (-not $ready) { throw 'The Windows app did not become ready.' }
            $page = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:18765/' -TimeoutSec 5
            if ($page.StatusCode -ne 200 -or $page.Content -notmatch 'InkReference') { throw 'The production UI was not served.' }
          } finally {
            if (-not $server.HasExited) { & taskkill.exe /PID $server.Id /T /F | Out-Null }
            if (Test-Path $stdout) { Get-Content $stdout }
            if (Test-Path $stderr) { Get-Content $stderr }
          }


      - name: Set up Conda without changing shell profiles
        if: runner.os == 'Windows'
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          activate-environment: ""
          auto-activate: false
          run-init: "false"
          remove-profiles: "false"
      - name: Create and install the Windows Conda environment
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\install.ps1 -EnvironmentName InkReferenceCI -BrowserOnly
      - name: Reuse the existing Conda environment
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\install.ps1 -EnvironmentName InkReferenceCI -BrowserOnly
      - name: Open the Conda browser app and check HTTP health
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:INKREFERENCE_DATA_DIR = Join-Path $env:RUNNER_TEMP ('InkReference Conda ' + [char]0x4e2d + [char]0x6587 + ' smoke')
          $stdout = Join-Path $env:RUNNER_TEMP 'inkreference-conda-stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'inkreference-conda-stderr.log'
          $arguments = @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', 'scripts/open.ps1', '-EnvironmentName', 'InkReferenceCI', '-Browser', '-NoOpen', '-Port', '18766')
          $server = Start-Process -FilePath 'powershell.exe' -ArgumentList $arguments -WorkingDirectory $PWD.Path -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          try {
            $ready = $false
            $lastProbeError = 'No HTTP response received.'
            for ($i = 0; $i -lt 50; $i++) {
              if ($server.HasExited) { throw 'The Conda launcher exited before becoming ready.' }
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:18766/api/health' -TimeoutSec 1
                if ($health.status -eq 'ok') { $ready = $true; break }
              } catch {
                $lastProbeError = $_.Exception.Message
                Start-Sleep -Milliseconds 200
              }
            }
            if (-not $ready) { throw "The Conda app did not become ready: $lastProbeError" }
            $page = Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:18766/' -TimeoutSec 5
            if ($page.StatusCode -ne 200 -or $page.Content -notmatch 'InkReference') { throw 'The Conda app did not serve the production UI.' }
          } finally {
            if (-not $server.HasExited) { & taskkill.exe /PID $server.Id /T /F | Out-Null }
            if (Test-Path $stdout) { Get-Content $stdout }
            if (Test-Path $stderr) { Get-Content $stderr }
          }

  frontend:
    name: Frontend typecheck and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  native-pdf:
    name: Real MinerU native PDF conversion
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install the app and optional MinerU runtime
        run: python -m pip install -c requirements-lock.txt -e ".[dev]" -r requirements-mineru.txt
      - name: Convert all 12 pages, preserve Chinese and render plain TXT
        run: python scripts/verify_mineru.py
