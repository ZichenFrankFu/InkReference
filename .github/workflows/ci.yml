name: InkReference checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend and source launcher (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: windows-latest
            python: '3.12'
          - os: macos-15
            python: '3.12'
          - os: macos-15-intel
            python: '3.13'
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install backend and test dependencies
        run: python -m pip install -c requirements-lock.txt -e ".[dev]"
      - name: Test data integrity, API and platform behavior
        run: python -m pytest -q
      - name: Parse Windows PowerShell scripts
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          foreach ($file in Get-ChildItem scripts/*.ps1) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { $parseErrors | Format-List; throw "Invalid PowerShell: $($file.Name)" }
          }
      - uses: actions/setup-node@v7
        if: runner.os != 'Linux'
        with:
          node-version: '22'
      - name: Install into the default project venv on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: .\scripts\install.ps1 -BrowserOnly -Dev
      - name: Install into the default project venv on macOS
        if: runner.os == 'macOS'
        run: ./scripts/install.sh --browser-only --dev
      - name: Reuse the project environment without Conda
        if: runner.os != 'Linux'
        run: python scripts/manage.py install --browser-only --dev
      - name: Diagnose the selected project environment
        if: runner.os != 'Linux'
        run: python scripts/manage.py doctor --json
      - name: Start the Windows wrapper with a Chinese data path
        if: runner.os == 'Windows'
        run: python scripts/verify_launch.py -- powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/open.ps1 -Browser -NoOpen -Port 18765
      - name: Start the macOS wrapper with a Chinese data path
        if: runner.os == 'macOS'
        run: python scripts/verify_launch.py -- bash scripts/open.sh --browser --no-open --port 18765
      - name: Reuse a developer-managed Python environment
        if: runner.os != 'Linux'
        run: python scripts/verify_launch.py --port 18766 -- python scripts/manage.py open --current-environment --browser --no-open --port 18766

  frontend:
    name: Frontend typecheck and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Verify chapter Unicode and line-ending preservation
        run: node scripts/verify-chapter-text.mjs
      - run: npm run build

  native-pdf:
    name: Real MinerU native PDF conversion
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install the app and optional MinerU runtime
        run: python -m pip install -c requirements-lock.txt -e ".[dev]" -r requirements-mineru.txt
      - name: Convert all 12 pages, preserve Chinese and render plain TXT
        run: python scripts/verify_mineru.py
